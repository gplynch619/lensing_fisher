# Fisher sensitivity kernel for the SPA (lensed) data combination.
#
# Run:  mpirun -n <N> lensing-fisher -i examples/fisher_spa.yaml
#
# Iteration protocol for the bin grid:
#   0. Run as written (log-spaced starting grid, C_fid from the fiducial cosmology).
#   1. python -m lensing_fisher.rebin <out.pkl> -o edges_1.yaml
#   2. Paste the new edges below, point bins.step_size.from_fisher at <out.pkl>,
#      bump the output filename, resubmit.
#   3. Stop when analysis.edges_converged and L_eff has stabilised.
# Once data/unlensed_bestfit_pp.pkl exists, switch bins.template to that file so
# r == 1 and the Fisher is exactly the A_template Fisher.

likelihoods:      !include datasets/spa.yaml#likelihoods
tied_parameters:  !include datasets/spa.yaml#tied_parameters

cosmology:
  fiducial:
    H0: 67.37
    ombh2: 0.02233
    omch2: 0.1198
    logA: 3.043
    ns: 0.9652
    tau: 0.054
  fixed:
    mnu: 0.06
    omk: 0
  step_sizes_relative:
    H0: 0.01
    ombh2: 0.01
    omch2: 0.01
    logA: 0.01
    ns: 0.01
    tau: 0.01
  nuisance_step_relative: 0.01
  # No tau prior here: this dataset includes the sroll2 low-l EE likelihood,
  # which constrains tau directly. Adding both would double-count.

camb:
  # Must match the chain configs' theory.camb.extra_args, or the Fisher and the
  # chain describe different models. nnu and halofit_version are CAMB 1.6.4
  # defaults and are stated only so a default change cannot silently split them;
  # bbn_predictor is NOT the default (CAMB 1.6.4 uses PRIMAT) and materially
  # changes Y_He, hence the damping tail where ACT and SPT dominate.
  set_cosmology:
    bbn_predictor: PArthENoPE_880.2_standard.dat
    nnu: 3.044
    num_massive_neutrinos: 1

  set_for_lmax:
    # Must cover the data. ACT DR6 bandpowers reach ell ~ 6126; the old
    # reference run used lmax 2500 and fed those bins zero theory. The
    # check_theory_lmax guard will refuse to start if this is too low.
    lmax: 6500
    lens_potential_accuracy: 8
    lens_margin: 2050
  matter_power:
    kmax: 10
    k_per_logint: 130
    nonlinear: true
  accuracy:
    # These carry over from the pre-2026 run. A Fisher matrix has a stronger
    # claim on them than a chain does: it is a second derivative taken by finite
    # differences, so numerical noise eps in C_ell lands in the answer as
    # ~eps/h^2, an amplification of order 1e4 at h ~ 0.01. What matters is
    # therefore the *smoothness* of CAMB's output in the parameters, not its
    # absolute accuracy — and lSampleBoost is the direct lever, since it sets
    # how densely ell is sampled before spline interpolation.
    #
    # Raising these costs real time at lmax 6500 / lens_potential_accuracy 8.
    # Measure before committing: cluster/RUNBOOK.md has a second-difference
    # stability check that answers it in ~12 CAMB calls rather than a rerun.
    AccuracyBoost: 1.0
    lSampleBoost: 1.0
    lAccuracyBoost: 1.2
    DoLateRadTruncation: false
    min_l_logl_sampling: 6000
  # Fraction of bandpower window weight allowed above the lensed-CMB lmax.
  window_support_tol: 1.0e-3

bins:
  # ITERATION 1. Equal-information grid from
  #   lensing-fisher-rebin spa_iter0.pkl -n 50 --min-width 3 --l-max 2000
  #
  # 50 bins over L=2..2000. The catch-all [2000, CAMB max_l] is appended
  # automatically (bins.extend_to_lmax) and is deliberately NOT listed here, so
  # the run has 51 bins — the same structure as iteration 0.
  #
  # `--l-max 2000` is not optional. Without it, rebin spans the input grid's full
  # range *including* the catch-all: ~98% of the weight sits below L~1000, so all
  # 50 bins landed under 999 and the 50th became [999, 8550]. That collapsed the
  # resolved range from 2000 to 999, spent a bin on the tail, and made the
  # catch-all's lower edge a free parameter — the source of the 375.93 "edge
  # movement" and of L_eff swinging 164 -> 261. Keep the top fixed at 2000 across
  # iterations so edge movement means what it says.
  #
  # Iteration 0 was `{start: 2, stop: 2000, n: 50, spacing: log}`. Do not go back
  # to that: log spacing from L=2 makes the first bins ~0.3 wide, narrower than
  # the sigmoid edges of their own basis functions, so they never reach 1 and
  # several contain no integer multipole at all. --min-width 3 prevents it; at
  # width 3 a basis function peaks at 0.995.
  edges: [2, 21.89, 30.14, 36.53, 42.08, 47.06, 51.62, 56.1, 60.28, 64.41,
          68.37, 72.32, 76.11, 79.89, 83.66, 87.41, 91.15, 94.9, 98.68, 102.5,
          106.3, 110.1, 114.1, 118.1, 122, 126, 130.4, 134.8, 139.2, 143.6,
          148.6, 153.7, 158.8, 164, 169.7, 176.2, 182.6, 189, 197.4, 206.3,
          215.2, 226.9, 241.1, 259.1, 286.9, 366, 449, 516.6, 666.4, 996.2,
          2000]
  steepness: 2

  template:
    # The UP-P (A1) best fit — chain converged 2026-08-04 at R-1 = 0.018, then
    # minimized from 16 starts (see cluster/RUNBOOK.md). Because C_fid is now the
    # template of interest, r == 1 identically and this Fisher is exactly the
    # A_template Fisher for that template. Do NOT pass --template to
    # lensing-fisher-rebin on its output.
    #
    # Previously ${MNU_HUNTER_ROOT}/src/unlensed_bestfit_pp.pkl, the pre-2026
    # template; against that one r ran 0.987..0.992, an almost pure ~1% amplitude
    # offset, and correcting for it moved the bin edges by less than the 3-wide
    # min width. So the grid above is unaffected by the swap, as expected.
    #
    # Generated at lens_potential_accuracy 8 rather than the 4 the chain sampled
    # at: below L=500 the two agree to 0.02%, but by L=4000-8550 lpa=4 is off by
    # 4.2%, and that range is the catch-all bin. lpa=8 is converged to 0.5%
    # against lpa=12. It also runs to L=10950, covering CAMB's max_l of 8550 with
    # no extrapolation.
    file: ${MNU_HUNTER_ROOT}/data/up_p_bestfit_pp.pkl

  # Fractional step in q. Keep this scalar — do NOT switch to the per-bin
  # `step_size: {from_fisher: ...}` form at iteration 1.
  #
  # That form exists to give weakly-constrained bins a larger step, sized off the
  # previous iteration's sigma(q_j). But sigma(q_j) requires inverting the
  # marginalized clpp block, which is rank-deficient by construction: on a 51-bin
  # grid only ~7 modes are resolved, so 21 of the 51 sigmas came back NaN. The
  # driver now raises rather than feeding those into a run.
  #
  # It is also solving a problem that does not exist here. Measured on the
  # iteration-0 setup, every clpp diagonal is stable to better than 0.1% across
  # h = 0.01 .. 5.0 — a 500x range. 0.05 is comfortably inside that plateau for
  # every bin, weak ones included.
  step_size: 0.05

output:
  directory: ${MNU_HUNTER_ROOT}/data/full_fishers
  filename: spa_iter1.pkl
