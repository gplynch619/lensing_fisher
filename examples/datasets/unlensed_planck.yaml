# "Unlensed Planck" (UP) — everything cut at ell <= 1000, where peak smoothing
# carries little information, so this set defines the lensing power *predicted*
# by the unlensed CMB rather than measured from it.
#
#   Planck  TT    30-1000   (plik-lite, clipy crop)
#   Planck  TE/EE 30-600    (plik-lite, clipy crop)
#   ACT DR6 TE/EE 600-1000  (TT dropped; Planck supplies TT below 1000)
#   SPT-3G  TT/TE/EE 425-1000
#   Planck low-l TT (commander) and low-l EE (sroll2 simall)
#
# The ell split follows P-ACT. The choice of 1000 comes from the
# sigma(A_lens) scan in notebooks/unlensed_estimation.ipynb.
#
# This block is consumed both by the Fisher driver and, via
# lensing_fisher.cobaya_likelihood.CandlClipyCombined, by the Cobaya
# chain — so the two see identical data by construction.
#
# Set PLANCK_CLIK_BASELINE to the directory holding the Planck 2018 plc_3.0
# baseline.

likelihoods:
  planck_lowl_tt:
    backend: clipy
    clik_path: ${PLANCK_CLIK_BASELINE}/low_l/commander/commander_dx12_v3_2_29.clik
    all_priors: true

  planck_lowl_ee:
    backend: clipy
    clik_path: ${PLANCK_CLIK_BASELINE}/low_l/sroll2/simall_100x143_sroll2_v3_EE_Aplanck.clik
    all_priors: true

  planck_highl_ttteee:
    backend: clipy
    clik_path: ${PLANCK_CLIK_BASELINE}/hi_l/plik_lite/plik_lite_v22_TTTEEE.clik
    all_priors: true
    crop:
      - "crop TT 0 1000 strict"
      - "crop TE 0 600 strict"
      - "crop EE 0 600 strict"

  act_dr6:
    backend: candl
    dataset: candl_data.ACT_DR6_TTTEEE
    # TT omitted deliberately: Planck covers TT below 1000, and ACT TT starts at
    # 600, so including it would double-count that range.
    ell_cuts:
      TE: [600, 1000]
      EE: [600, 1000]

  spt3g_D1:
    backend: candl
    dataset: spt_candl_data.SPT3G_D1_TnE_lite
    ell_cuts:
      TT: [0, 1000]
      TE: [0, 1000]
      EE: [0, 1000]
