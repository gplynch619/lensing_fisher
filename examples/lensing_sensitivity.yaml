# Reproduces the run that produced data/full_fishers/lensing_sensitivity_reference.pkl.
# Set PLANCK_CLIK_BASELINE to the directory holding the Planck 2018 plc_3.0 baseline.

likelihoods:
  planck_highl_ttteee:
    backend: clipy
    clik_path: ${PLANCK_CLIK_BASELINE}/hi_l/plik_lite/plik_lite_v22_TTTEEE.clik
    all_priors: true
    crop:
      - "crop TT 0 1000 strict"
      - "crop TE 0 600 strict"
      - "crop EE 0 600 strict"
  lowl_tt:
    backend: clipy
    clik_path: ${PLANCK_CLIK_BASELINE}/low_l/commander/commander_dx12_v3_2_29.clik
    all_priors: true
  spt3g_D1:
    backend: candl
    dataset: spt_candl_data.SPT3G_D1_TnE_lite
  act_dr6:
    backend: candl
    dataset: candl_data.ACT_DR6_TTTEEE

cosmology:
  fiducial:
    H0: 67.37
    ombh2: 0.02233
    omch2: 0.1198
    logA: 3.043
    ns: 0.9652
    tau: 0.054
  fixed:
    mnu: 0.06
    omk: 0
  step_sizes_relative:
    H0: 0.01
    ombh2: 0.01
    omch2: 0.01
    logA: 0.01
    ns: 0.01
    tau: 0.01
  nuisance_step_relative: 0.01
  tau_prior:
    mean: 0.054
    sigma: 0.0074

camb:
  set_for_lmax:
    lmax: 2500
    lens_potential_accuracy: 8
    lens_margin: 2050
  matter_power:
    kmax: 10
    k_per_logint: 130
    nonlinear: true
  accuracy:
    AccuracyBoost: 1.0
    lSampleBoost: 1.0
    lAccuracyBoost: 1.2
    DoLateRadTruncation: false
    min_l_logl_sampling: 6000

bins:
  parametrization: local_lens
  L_centers:
    start: 20
    stop: 995        # 40 centers stepping by 25 from 20 (matches old Lg[:40])
    step: 25
  width: 25
  steepness: 2
  amp_unit: 1.0e-7
  step_size_abs: 0.5

output:
  directory: ${MNU_HUNTER_ROOT}/data/full_fishers
  filename: lensing_sensitivity_reference.pkl
